[project]
name = "pg-stream-copy"
version = "4.0.1"
description = "RTB House apps pg_stream_copy"
authors = [{ name = "RTB House Apps Team", email = "apps@rtbhouse.com" }]
requires-python = ">=3.10, <4.0"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.3,<3",
    "types-psycopg2>=2.9.19,<3",
    "black>=26.0.0,<27",
    "flake8>=7.0.0,<8",
    "isort>=9.0.0,<10",
    "mypy>=2.1,<3",
    "pylint>=4.0.0,<5",
    "pytest>=9.0.0,<10",
    "pytest-cov>=7.0.0,<8",
    "pytest-mock>=3.10.0,<4",
]

[tool.uv]
required-version = ">=0.13.5,<0.14"

[tool.hatch.build.targets.sdist]
include = ["pg_stream_copy"]

[tool.hatch.build.targets.wheel]
packages = ["pg_stream_copy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.isort]
line_length = 120
profile = "black"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pylint.main]
load-plugins = """
    pylint.extensions.check_elif,
    pylint.extensions.confusing_elif,
    pylint.extensions.consider_ternary_expression,
    pylint.extensions.empty_comment,
    pylint.extensions.eq_without_hash,
    pylint.extensions.for_any_all,
    pylint.extensions.redefined_loop_name,
    pylint.extensions.redefined_variable_type,
    pylint.extensions.set_membership,
    pylint.extensions.typing,
"""
extension-pkg-whitelist = "psycopg2"

[tool.pylint.format]
max-line-length = "120"

[tool.pylint.message_control]
enable = "all"
disable = """
    broad-except,
    broad-exception-raised,
    duplicate-code,
    missing-class-docstring,
    missing-function-docstring,
    missing-module-docstring,
    no-else-return,
"""

[tool.pytest.ini_options]
addopts = "--cov=pg_stream_copy/ --cov-report=term"
